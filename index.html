<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CYMAP</title>
  <link rel="icon" type="image/png" href="./CYPRUS-REPUBLIC-LOGO.png">
  <link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
  <link href="https://unpkg.com/@mapbox/mapbox-gl-draw@1.5.0/dist/mapbox-gl-draw.css" rel="stylesheet">
  <link href="./style.css" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img id="brand-logo" src="CYPRUS-REPUBLIC-LOGO.png" alt="Republic of Cyprus emblem"><div><strong>CYMAP</strong></div></div>
    <div class="header-actions">
      <span id="status" class="status">Connecting…</span>
      <button id="login-open" class="button secondary">Είσοδος</button>
      <button id="logout" class="button secondary hidden">Έξοδος</button>
    </div>
  </header>

  <main class="app">
    <aside id="sidebar" class="sidebar">
  <button id="sidebar-collapse" class="sidebar-collapse" type="button" aria-label="Σύμπτυξη πλευρικής στήλης" aria-expanded="true">◀</button>
      <div class="side-heading"><div><h1></h1><p></p></div></div>
      <div id="layers" class="layers"><div class="empty">Loading layers…</div></div>
      
      <section id="editor-panel" class="editor-panel hidden">
        
        <p class="muted"></p>
        <select id="active-layer" class="hidden" aria-hidden="true" tabindex="-1"></select>
        <div class="button-stack">
          <button id="draw-point" class="button primary">＋ Προσθήκη σημείου</button>
          <button id="draw-polygon" class="button primary">＋ Προσθήκη πολυγώνου</button>
          <button id="coordinate-point" class="button secondary">＋ Προσθήκη σημείου με συντεταγμένες</button>
          <button id="coordinate-polygon" class="button secondary">＋ Προσθήκη πολυγώνου με συντεταγμένες</button>
        </div>
        
      </section>
    </aside>
    <section class="map-wrap">
      <div id="map" aria-label="Interactive map of Cyprus"></div>
</section>
  </main>

  <dialog id="login-dialog">
    <form id="login-form" method="dialog">
      <button type="button" id="login-close" class="dialog-close" aria-label="Close">×</button>
      <h2>Είσοδος</h2>
      <label for="username">Όνομα χρήστη</label>
      <input id="username" name="username" autocomplete="username" required placeholder="e.g. mjpo">
      <label for="password">Κωδικός πρόσβασης</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="error" role="alert"></p>
      <button class="button primary full" type="submit">Είσοδος</button>
    </form>
  </dialog>

  <dialog id="feature-dialog">
    <form id="feature-form" method="dialog">
      <button type="button" id="feature-close" class="dialog-close" aria-label="Close">×</button>
      <h2 id="feature-heading">Feature details</h2>
      <input type="hidden" id="feature-id">
      <label for="feature-name">Όνομα</label>
      <input id="feature-name" maxlength="250" required>
      <label for="feature-color">Χρώμα</label>
      <input id="feature-color" type="color" value="#16a34a" aria-label="Feature color">
      <section id="edit-polygon-coordinate-fields" class="hidden">
        <p class="muted">Συντεταγμένες κορυφών (πλάτος και μετά μήκος)</p>
        <div id="edit-polygon-coordinate-list"></div>
        <button type="button" id="edit-add-coordinate-row" class="button secondary">＋ Προσθήκη κορυφής</button>
      </section>
      <div class="dialog-actions">
        <button id="feature-delete" type="button" class="button danger hidden">Delete feature</button>
        <button id="feature-save" type="submit" class="button primary">Αποθήκευση</button>
      </div>
      <p id="feature-error" class="error" role="alert"></p>
    </form>
  </dialog>


<dialog id="delete-dialog" class="feature-dialog">
    <form method="dialog" class="dialog-form">
      <h2>Διαγραφή στοιχείου</h2>
      <p>Να διαγραφεί οριστικά το στοιχείο;</p>
      <p id="delete-feature-name" class="delete-feature-name"></p>
      <p id="delete-error" class="form-error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" id="delete-cancel" class="button secondary">Ακύρωση</button>
        <button type="button" id="delete-confirm" class="button danger">Διαγραφή</button>
      </div>
    </form>
  </dialog>


  <dialog id="coordinate-dialog" class="dialog">
    <form id="coordinate-form" method="dialog">
      <button type="button" id="coordinate-close" class="dialog-close" aria-label="Κλείσιμο">×</button>
      <h2 id="coordinate-heading">Προσθήκη με συντεταγμένες</h2>
      <label for="coordinate-name">Όνομα</label>
      <input id="coordinate-name" maxlength="250" required>
      <label for="coordinate-color">Χρώμα</label>
      <input id="coordinate-color" type="color" value="#16a34a" required>
      <section id="point-coordinate-fields">
        <label for="point-latitude">Γεωγραφικό πλάτος (Latitude)</label>
        <input id="point-latitude" type="number" step="any" min="-90" max="90" placeholder="π.χ. 35.1856" required>
        <label for="point-longitude">Γεωγραφικό μήκος (Longitude)</label>
        <input id="point-longitude" type="number" step="any" min="-180" max="180" placeholder="π.χ. 33.3823" required>
      </section>
      <section id="polygon-coordinate-fields" class="hidden">
        <p class="muted">Καταχωρίστε τουλάχιστον 3 κορυφές. Οι συντεταγμένες δίνονται ως γεωγραφικό μήκος και πλάτος.</p>
        <div id="polygon-coordinate-list"></div>
        <button type="button" id="add-coordinate-row" class="button secondary">＋ Προσθήκη κορυφής</button>
      </section>
      <p id="coordinate-error" class="error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" id="coordinate-cancel" class="button secondary">Ακύρωση</button>
        <button type="submit" id="coordinate-save" class="button primary">Αποθήκευση</button>
      </div>
    </form>
  </dialog>

  <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@mapbox/mapbox-gl-draw@1.5.0/dist/mapbox-gl-draw.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
